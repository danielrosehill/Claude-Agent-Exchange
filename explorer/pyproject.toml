[project]
name = "claude-agent-exchange"
version = "0.1.0"
description = "A small file explorer locked to the Claude agent exchange folder (from-human / from-agent)"

requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6>=6.6"]

[project.scripts]
claude-agent-exchange = "agent_exchange.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_exchange"]
